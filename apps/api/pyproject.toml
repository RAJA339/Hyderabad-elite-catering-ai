[project]
name = "hecai-api"
version = "0.1.0"
description = "HEC-AI — Hyderabad Elite Catering AI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "asyncpg>=0.29",
  "redis>=5.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "openai>=1.50",
  "apscheduler>=3.10,<4",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "structlog>=24.1",
  "tiktoken>=0.7",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
rerank = ["cohere>=5.5", "sentence-transformers>=3.0"]
observability = ["langfuse>=2.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hecai
      POSTGRES_PASSWORD: hecai
      POSTGRES_DB: hecai
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    # The Dockerfile needs the repo root as its context, not apps/api.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hecai:hecai@db:5432/hecai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./knowledge:/knowledge:ro
      - ./eval:/eval:ro
    ports: ["8000:8000"]
    depends_on: [db, redis]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
